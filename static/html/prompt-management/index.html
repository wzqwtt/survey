let seq = 0;
async function renderDiagrams(root) {
  for (const box of root.querySelectorAll(".mermaid-box[data-diagram]:not([data-done])")) {
    if (box.offsetParent === null) continue;
    box.setAttribute("data-done", "1");
    const key = box.dataset.diagram;
    try {
      const { svg } = await mermaid.render(`mmd-${key}-${seq++}`, D[key]);
      box.innerHTML = svg;
    } catch (e) {
      box.innerHTML = `<div class="err">Mermaid 渲染失败（${key}）：${String(e.message || e)}</div>`;
    }
  }
}

      `${i ? '<span class="arrow">→</span>' : ""}<button class="step ${s.cls}" data-i="${i}"><span class="n">${i + 1}</span>${st.t}</button>`).join("")}</div>
    <div class="card detail" id="detail-${id}"></div>
    <div class="card"><h3 style="margin-top:0">架构</h3><div class="mermaid-box" data-diagram="${s.arch}"></div></div>
    <div class="card"><h3 style="margin-top:0">风险与缺口</h3>${s.risks.map(([t, d]) => `<div class="risk"><b>${t}</b>：${rich(d)}</div>`).join("")}</div>`;
  const show = (i) => {
    el.querySelectorAll(".step").forEach((b) => b.classList.toggle("active", +b.dataset.i === i));
    const st = s.steps[i];
    el.querySelector(`#detail-${id}`).innerHTML = `
      <h3>${i + 1}. ${st.t}</h3><div class="summary">${st.sum}</div>
      <ul>${st.items.map((x) => `<li>${rich(x)}</li>`).join("")}</ul>
      ${st.diagram ? `<div class="mermaid-box" data-diagram="${st.diagram}"></div>` : ""}`;
    renderDiagrams(el);
  };
  el.querySelectorAll(".step").forEach((b) => b.addEventListener("click", () => show(+b.dataset.i)));
  show(0);
}

function buildMatrix() {
  const groups = M.map(([g]) => g);
  let active = "全部", q = "";
  const tb = document.getElementById("matrix-toolbar");
  tb.innerHTML = ["全部", ...groups].map((g) => `<button data-g="${g}" class="${g === active ? "on" : ""}">${g}</button>`).join("") +
    `<input id="mq" placeholder="搜索：如 缓存、标签、semver">`;
  const table = document.getElementById("matrix-table");
  const draw = () => {
    let html = `<tr><th>维度</th><th class="cz">coze-loop</th><th class="lf">Langfuse</th></tr>`;
    for (const [g, rows] of M) {
      if (active !== "全部" && active !== g) continue;
      const rs = rows.filter((r) => !q || r.join(" ").toLowerCase().includes(q));
      if (!rs.length) continue;
      html += `<tr class="group"><td colspan="3">${g}</td></tr>`;
      html += rs.map(([d, c, l]) => `<tr><td class="dim">${d}</td><td>${rich(c)}</td><td>${rich(l)}</td></tr>`).join("");
    }
    table.innerHTML = html;
  };
  tb.querySelectorAll("button").forEach((b) => b.addEventListener("click", () => {
    active = b.dataset.g; tb.querySelectorAll("button").forEach((x) => x.classList.toggle("on", x === b)); draw();
  }));
  tb.querySelector("#mq").addEventListener("input", (e) => { q = e.target.value.trim().toLowerCase(); draw(); });
  draw();
}

function buildAdvice() {
  document.getElementById("tab-advice").innerHTML = `
    <h2>自建提示词库的建议 <span class="tag inf">推断，非源码事实</span></h2>
    <div class="card"><h3 style="margin-top:0">应该采用</h3><ol>${ADVICE.adopt.map((x) => `<li>${rich(x)}</li>`).join("")}</ol></div>
    <div class="card"><h3 style="margin-top:0">按需选择</h3><table>
      <tr><th>选择</th><th class="cz">方案 A</th><th class="lf">方案 B</th></tr>
      ${ADVICE.choose.map(([a, b, c]) => `<tr><td class="dim">${a}</td><td>${b}</td><td>${c}</td></tr>`).join("")}</table></div>
    <div class="card"><h3 style="margin-top:0">应该避免</h3>${ADVICE.avoid.map((x) => `<div class="risk">${rich(x)}</div>`).join("")}</div>
    <p class="note">建议的最小数据模型见 <a href="../../research/ai-engineering/prompt-management/comparison/#34-最小可行数据模型建议">comparison.md §3.4</a>。</p>`;
}

document.getElementById("summary-table").innerHTML =
  `<tr><th>维度</th><th class="cz">coze-loop</th><th class="lf">Langfuse</th></tr>` +
  SUMMARY.map(([d, c, l]) => `<tr><td class="dim">${d}</td><td>${c}</td><td>${l}</td></tr>`).join("");
buildSystem("cz"); buildSystem("lf"); buildMatrix(); buildAdvice();

function activate(tab) {
  document.querySelectorAll("#nav button").forEach((b) => b.classList.toggle("active", b.dataset.tab === tab));
  document.querySelectorAll("section.tab").forEach((s) => s.classList.toggle("active", s.id === `tab-${tab}`));
  history.replaceState(null, "", `#${tab}`);
  renderDiagrams(document.getElementById(`tab-${tab}`));
}
document.querySelectorAll("#nav button").forEach((b) => b.addEventListener("click", () => activate(b.dataset.tab)));
const initial = location.hash.slice(1);
activate(SYS[initial] || ["matrix", "advice", "overview"].includes(initial) ? initial : "overview");

// Expose for automated checks: renders every diagram off-screen and reports failures.
window.__checkAllDiagrams = async () => {
  const out = {};
  for (const [k, code] of Object.entries(D)) {
    try { await mermaid.parse(code); out[k] = "ok"; } catch (e) { out[k] = String(e.message || e); }
  }
  return out;
};
</script>
</body>
