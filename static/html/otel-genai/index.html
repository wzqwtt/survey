const lvClass = { "必填":"req", "条件必填":"cond", "建议":"rec", "选择加入":"opt" };
function lv(text) {
  const key = text.startsWith("条件") ? "条件必填" : (lvClass[text] ? text : "");
  const cls = lvClass[key] || "";
  return cls ? `<span class="lv ${cls}">${text}</span>` : text;
}

let mode = "op";
let current = null;
const q = document.getElementById("q");
const list = document.getElementById("list");
const detail = document.getElementById("detail");

document.getElementById("bar").addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-mode]");
  if (!btn) return;
  mode = btn.dataset.mode;
  current = null;
  for (const b of document.querySelectorAll("button[data-mode]")) b.classList.toggle("on", b === btn);
  render();
});
q.addEventListener("input", () => { current = null; render(); });

function match(text) {
  const s = q.value.trim().toLowerCase();
  return !s || text.toLowerCase().includes(s);
}

function render() {
  const rows = mode === "op" ? OPS.filter((o) => match(o.name + o.brief + o.group)) : ATTRS.filter((a) => match(a.name + a.note + a.group));
  const groups = [];
  for (const row of rows) {
    let g = groups.find((x) => x.name === row.group);
    if (!g) groups.push(g = {name: row.group, rows: []});
    g.rows.push(row);
  }
  if (!groups.length) {
    list.innerHTML = `<p class="note">没有匹配项。</p>`;
  } else {
    list.innerHTML = groups.map((g) => `<section class="group"><h2>${g.name}</h2>${g.rows.map((row) => {
      const id = mode === "op" ? row.id : row.name;
      const label = mode === "op" ? row.name : row.name;
      const badge = mode === "op" ? row.kind.split("，")[0] : row.type;
      return `<button type="button" class="item${current === id ? " active" : ""}" data-id="${id}"><span class="name">${label}</span><span class="badge">${badge}</span></button>`;
    }).join("")}</section>`).join("");
  }
  if (!current) {
    detail.innerHTML = `<p class="note">点左侧一项。这里给出 Span 名、种类、要求级别，并链到该提交的规范原文。</p>`;
  }
}

list.addEventListener("click", (e) => {
  const btn = e.target.closest("button[data-id]");
  if (!btn) return;
  current = btn.dataset.id;
  const row = mode === "op" ? OPS.find((o) => o.id === current) : ATTRS.find((a) => a.name === current);
  if (mode === "op") showOp(row); else showAttr(row);
  render();
});

function showOp(op) {
  const attrRows = op.attrs.map(([n, l]) => `<tr><td><code>${n}</code></td><td>${lv(l)}</td></tr>`).join("");
  detail.innerHTML = `
    <h3>${op.name}</h3>
    <p>${op.brief}</p>
    <dl class="meta">
      <dt>Span 类型</dt><dd><code>${op.spanType}</code></dd>
      <dt>Span 名</dt><dd><code>${op.span}</code></dd>
      <dt>种类</dt><dd>${op.kind}</dd>
      <dt>事件</dt><dd>${op.events.map((x) => `<div>${x}</div>`).join("")}</dd>
      <dt>指标</dt><dd>${op.metrics.map((x) => `<div><code>${x}</code></div>`).join("")}</dd>
    </dl>
    <table><thead><tr><th>属性</th><th>要求级别</th></tr></thead><tbody>${attrRows}</tbody></table>
    <div class="links">${op.links.map(([label, path, lines]) => `<a href="${blob(path, lines)}">${label}</a>`).join("")}</div>`;
}

function showAttr(a) {
  detail.innerHTML = `
    <h3>${a.name}</h3>
    <p>${a.note}</p>
    <dl class="meta">
      <dt>类型</dt><dd>${a.type}</dd>
      <dt>要求级别</dt><dd>${a.level}</dd>
      <dt>示例</dt><dd><code>${a.example}</code></dd>
      <dt>稳定级别</dt><dd>development</dd>
    </dl>
    <div class="links"><a href="${blob(a.lines[0], a.lines[1])}">${a.lines[0]} L${a.lines[1].replace("-L","–")}</a></div>`;
}

render();
</script>
