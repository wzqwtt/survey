const sysLabel = {cz:"coze-loop", lf:"Langfuse"};
let sys = "all";
let exist = "all";
let current = null;

function visible() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  return ITEMS.filter((item) => {
    if (sys !== "all" && item.sys !== sys) return false;
    if (exist !== "all" && item.exist !== exist) return false;
    if (!q) return true;
    return (item.name + " " + item.text + " " + item.group).toLowerCase().includes(q);
  });
}

function renderList() {
  const rows = visible();
  const root = document.getElementById("list");
  root.replaceChildren();
  if (rows.length === 0) {
    const p = document.createElement("p");
    p.className = "empty";
    p.textContent = "没有匹配的能力。";
    root.append(p);
    return;
  }
  const groups = [];
  rows.forEach((item) => {
    if (!groups.includes(item.group)) groups.push(item.group);
  });
  groups.forEach((group) => {
    const section = document.createElement("section");
    section.className = "group";
    const h = document.createElement("h2");
    h.textContent = group;
    section.append(h);
    rows.filter((item) => item.group === group).forEach((item) => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "item" + (item === current ? " active" : "");
      const name = document.createElement("span");
      name.className = "name";
      name.textContent = item.name;
      const badge = document.createElement("span");
      badge.className = "badge " + item.sys;
      badge.textContent = sysLabel[item.sys];
      const st = document.createElement("span");
      st.className = "st " + item.exist;
      st.textContent = item.exist === "yes" ? "有" : "无";
      btn.append(name, badge, st);
      btn.addEventListener("click", () => {
        current = item;
        renderList();
        renderDetail();
      });
      section.append(btn);
    });
    root.append(section);
  });
}

function renderDetail() {
  const box = document.getElementById("detail");
  box.replaceChildren();
  if (!current) {
    const p = document.createElement("p");
    p.className = "note";
    p.textContent = "点左侧一项能力。这里给出一句结论，并链到固定提交上的源码。";
    box.append(p);
    return;
  }
  const h = document.createElement("h3");
  h.textContent = current.name;
  const meta = document.createElement("p");
  const badge = document.createElement("span");
  badge.className = "badge " + current.sys;
  badge.textContent = sysLabel[current.sys];
  const st = document.createElement("span");
  st.className = "st " + current.exist;
  st.textContent = current.exist === "yes" ? "有" : "无";
  meta.append(badge, document.createTextNode(" "), st);
  const text = document.createElement("p");
  text.textContent = current.text;
  const links = document.createElement("div");
  links.className = "links";
  current.links.forEach(([label, href]) => {
    const a = document.createElement("a");
    a.href = href;
    a.textContent = label;
    links.append(a);
  });
  box.append(h, meta, text, links);
}

document.getElementById("q").addEventListener("input", renderList);
document.getElementById("bar").addEventListener("click", (event) => {
  const btn = event.target.closest("button");
  if (!btn) return;
  if (btn.dataset.sys) {
    sys = btn.dataset.sys;
    document.querySelectorAll("[data-sys]").forEach((el) => el.classList.toggle("on", el === btn));
  }
  if (btn.dataset.exist) {
    exist = btn.dataset.exist;
    document.querySelectorAll("[data-exist]").forEach((el) => el.classList.toggle("on", el === btn));
  }
  renderList();
});
renderList();
