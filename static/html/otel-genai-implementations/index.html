    signals:[["常量","含 gen_ai.provider.name 与 gen_ai.input.messages"]],
    links:[["GenAiAttributes.cs","https://github.com/open-telemetry/opentelemetry-dotnet-contrib/blob/401943ba421fd102001d2bfe84e663ea333d5308/src/OpenTelemetry.SemanticConventions/Attributes/GenAiAttributes.cs#L230"]]},
  {id:"js-util", cls:"none", name:"JS genai-util", ver:"0.2.0 · cc263ac4",

    signals:[["直方图常量","仍是旧名"]],
    links:[["空事件","https://github.com/open-telemetry/opentelemetry-js-contrib/blob/cc263ac4e94320402ac3afe50d50eb00905e1bb8/packages/genai-util/src/invocations/base.ts#L362-L375"]]}
];
const LABELS = {new:"实现了", old:"旧版或部分字段", other:"另一套或只消费", none:"没有这套信号"};
const list = document.getElementById("list");
const detail = document.getElementById("detail");
let filter = "all";
let current = null;
function render() {
  const q = document.getElementById("q").value.trim().toLowerCase();
  list.innerHTML = "";
  ITEMS.filter(item => (filter === "all" || item.cls === filter) && (!q || (item.name + item.ver).toLowerCase().includes(q)))
    .forEach(item => {
      const btn = document.createElement("button");
      btn.type = "button";
      btn.className = "item" + (current === item.id ? " active" : "");
      btn.innerHTML = '<span class="name"></span><span class="ver"></span><span class="badge"></span>';
      btn.querySelector(".name").textContent = item.name;
      btn.querySelector(".ver").textContent = item.ver;
      const badge = btn.querySelector(".badge");
      badge.textContent = LABELS[item.cls];
      badge.classList.add(item.cls);
      btn.addEventListener("click", () => { current = item.id; show(item); render(); });
      list.appendChild(btn);
    });
}
function show(item) {
  detail.innerHTML = "";
  const h = document.createElement("h3");
  h.textContent = item.name;
  detail.appendChild(h);
  const p = document.createElement("p");
  p.textContent = item.gate;
  detail.appendChild(p);
  const table = document.createElement("table");
  const head = document.createElement("tr");
  head.innerHTML = "<th>信号</th><th>这一版</th>";
  table.appendChild(head);
  item.signals.forEach(row => {
    const tr = document.createElement("tr");
    const a = document.createElement("td");
    const b = document.createElement("td");
    a.textContent = row[0];
    b.textContent = row[1];
    tr.append(a, b);
    table.appendChild(tr);
  });
  detail.appendChild(table);
  const links = document.createElement("div");
  links.className = "links";
  item.links.forEach(link => {
    const a = document.createElement("a");
    a.href = link[1];
    a.textContent = link[0];
    links.appendChild(a);
  });
  detail.appendChild(links);
}
document.getElementById("q").addEventListener("input", render);
document.querySelectorAll(".toolbar button").forEach(btn => {
  btn.addEventListener("click", () => {
    filter = btn.dataset.filter;
    document.querySelectorAll(".toolbar button").forEach(b => b.classList.toggle("on", b === btn));
    render();
  });
});
render();
</script>
