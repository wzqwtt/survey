<style>
:root {

  --cz: #2563eb; --cz-soft: #e6eefe; --cz-ink: #1d4ed8;

  --accent: #0f766e; --accent-soft: #e0f4f1;
  --y: #15803d; --y-soft: #dcf5e4; --p: #a16207; --p-soft: #fdf1c7; --n: #b42318; --n-soft: #fde4e1; --x: #6b7280; --x-soft: #eceff3;
  --warn-soft: #fff4d6; --warn-ink: #8a5a00;
  --inf: #7e22ce; --inf-soft: #f2e8fd;
  --hdr1: #14213d; --hdr2: #1f3a6b; --hdr-ink: #f4f7fd; --hdr-mut: #b8c4dc;
  --l-data: #e8effd; --l-query: #e2f5f0; --l-feedback: #f1eafc; --l-govern: #eef0f4;
  --shadow: 0 1px 2px rgba(20,33,61,.06), 0 4px 14px rgba(20,33,61,.05);
}
html[data-theme="dark"] {
  color-scheme: dark;
  --bg: #0f141c; --surface: #171e29; --surface2: #1e2735; --text: #e6ebf3; --muted: #9aa6b8; --border: #2c3748; --border2: #243041;
  --cz: #6ea1ff; --cz-soft: #1a2a4a; --cz-ink: #9bbcff;
  --lf: #ff9a63; --lf-soft: #3a2316; --lf-ink: #ffb589;
  --accent: #4fd1c0; --accent-soft: #133631;
  --y: #4ade80; --y-soft: #14321f; --p: #facc15; --p-soft: #3a3010; --n: #ff7b72; --n-soft: #3d1a18; --x: #98a2b3; --x-soft: #252d3a;
  --warn-soft: #3a2e0e; --warn-ink: #f6c453;
  --inf: #d2a8ff; --inf-soft: #2c1d44;
  --hdr1: #0b1220; --hdr2: #16284a; --hdr-ink: #eef3fb; --hdr-mut: #93a3c0;
  --l-data: #16213a; --l-query: #13302b; --l-feedback: #251c3b; --l-govern: #1c2330;

}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; }
body { margin: 0; font: 15px/1.6 -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", "Noto Sans CJK SC", sans-serif; background: var(--bg); color: var(--text); }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
a { color: var(--accent); }
code { font: 12.5px ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; background: var(--surface2); border: 1px solid var(--border2); padding: 0 4px; border-radius: 4px; word-break: break-word; }
:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; }

/* header */
header { background: linear-gradient(135deg, var(--hdr1), var(--hdr2)); color: var(--hdr-ink); padding: 20px 28px 0; }
.hrow { display: flex; gap: 16px; align-items: flex-start; justify-content: space-between; flex-wrap: wrap; }

.meta { color: var(--hdr-mut); font-size: 13px; display: flex; flex-wrap: wrap; gap: 4px 14px; }
.meta a { color: #9cc4ff; }
.theme-btn { border: 1px solid rgba(255,255,255,.28); background: rgba(255,255,255,.08); color: var(--hdr-ink); border-radius: 16px; padding: 3px 12px; font-size: 13px; }
.theme-btn:hover { background: rgba(255,255,255,.16); }
nav { display: flex; gap: 4px; margin-top: 14px; flex-wrap: wrap; }
nav button { border: 0; background: transparent; color: var(--hdr-mut); padding: 9px 16px; font-size: 15px; border-radius: 8px 8px 0 0; }
nav button:hover { color: #fff; }
nav button[aria-selected="true"] { background: var(--bg); color: var(--text); font-weight: 600; }
main { max-width: 1320px; margin: 0 auto; padding: 22px 28px 48px; }
section.tab { display: none; }
section.tab.on { display: block; }
h2 { font-size: 18px; margin: 26px 0 10px; }
h2:first-child { margin-top: 0; }
h3 { margin: 0 0 8px; font-size: 15px; }
.note { color: var(--muted); font-size: 13px; }
.card { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; padding: 14px 18px; box-shadow: var(--shadow); }

/* tags and status */
.tag { display: inline-block; font-size: 12px; line-height: 18px; padding: 0 8px; border-radius: 10px; font-weight: 600; white-space: nowrap; }
.tag.cz { background: var(--cz-soft); color: var(--cz-ink); }
.tag.lf { background: var(--lf-soft); color: var(--lf-ink); }
.tag.inf { background: var(--inf-soft); color: var(--inf); }
.tag.lyr { background: var(--surface2); color: var(--muted); border: 1px solid var(--border2); }
.pill { display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700; line-height: 18px; padding: 0 8px 0 6px; border-radius: 10px; white-space: nowrap; }
.pill::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: currentColor; }
.pill.y { background: var(--y-soft); color: var(--y); }
.pill.p { background: var(--p-soft); color: var(--p); }
.pill.p::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px currentColor; }
.pill.n { background: var(--n-soft); color: var(--n); }
.pill.n::before { background: transparent; box-shadow: inset 0 0 0 1.5px currentColor; }
.pill.x { background: var(--x-soft); color: var(--x); }
.pill.x::before { background: transparent; width: 8px; height: 2px; border-radius: 1px; background: currentColor; }
.dot { display: inline-block; width: 11px; height: 11px; border-radius: 50%; vertical-align: -1px; }
.dot.y { background: var(--y); }
.dot.p { background: linear-gradient(90deg, var(--p) 50%, transparent 50%); box-shadow: inset 0 0 0 1.5px var(--p); }
.dot.n { box-shadow: inset 0 0 0 1.5px var(--n); }
.dot.x { background: var(--x-soft); box-shadow: inset 0 0 0 1px var(--border); opacity: .8; }
.dots { display: inline-flex; gap: 4px; align-items: center; flex: none; padding-left: 8px; }
.dots .dot { position: relative; }

/* filter bar */
.fbar { display: flex; flex-wrap: wrap; gap: 8px 10px; align-items: center; margin-bottom: 12px; padding: 10px 12px; background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); }
.fbar .grp { display: inline-flex; gap: 4px; align-items: center; flex-wrap: wrap; }
.fbar .lbl { font-size: 12px; color: var(--muted); margin-right: 2px; }
.fbar input[type="search"] { border: 1px solid var(--border); background: var(--surface2); border-radius: 16px; padding: 4px 12px; min-width: 200px; flex: 1 1 200px; max-width: 320px; }
.seg button, .fbar .tog { border: 1px solid var(--border); background: var(--surface2); border-radius: 14px; padding: 2px 11px; font-size: 13px; }
.seg button[aria-pressed="true"], .fbar .tog[aria-pressed="true"] { background: var(--text); color: var(--bg); border-color: var(--text); }
.fbar .count { margin-left: auto; font-size: 13px; color: var(--muted); }
.fbar .reset { border: 0; background: transparent; color: var(--accent); font-size: 13px; text-decoration: underline; padding: 0 4px; }

/* overview */
.stats { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 14px; }
.stat h3 { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.stat .big { font-size: 28px; font-weight: 700; line-height: 1.1; }
.sbar { display: flex; height: 14px; border-radius: 7px; overflow: hidden; background: var(--x-soft); margin: 8px 0 6px; }
.sbar i { display: block; height: 100%; }
.sbar i.y { background: var(--y); } .sbar i.p { background: var(--p); } .sbar i.n { background: var(--n); } .sbar i.x { background: var(--x); opacity: .45; }
.slegend { display: flex; gap: 4px 12px; flex-wrap: wrap; font-size: 13px; color: var(--muted); }
.slegend b { color: var(--text); }
.layerbars { display: grid; grid-template-columns: minmax(0,1fr); gap: 8px; margin-top: 12px; }
.lb { display: grid; grid-template-columns: 92px minmax(0,1fr); gap: 8px; align-items: center; font-size: 13px; }
.lb .sbar { margin: 0; height: 10px; }
.keys { display: grid; grid-template-columns: repeat(auto-fill, minmax(290px, 1fr)); gap: 12px; }
.key { text-align: left; background: var(--surface); border: 1px solid var(--border); border-left-width: 4px; border-radius: 10px; padding: 10px 14px; box-shadow: var(--shadow); display: block; width: 100%; }
.key.cz { border-left-color: var(--cz); } .key.lf { border-left-color: var(--lf); } .key.both { border-left-color: var(--accent); }
.key:hover { border-color: var(--accent); }
.key .t { font-weight: 650; margin-bottom: 3px; }
.key .d { font-size: 13.5px; color: var(--muted); }
.key .go { font-size: 12px; color: var(--accent); margin-top: 6px; display: flex; gap: 6px; align-items: center; }
.howto { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 10px 18px; font-size: 13.5px; }
.howto p { margin: 2px 0; }
.heat { width: 100%; border-collapse: collapse; font-size: 14px; }
.heat th, .heat td { padding: 6px 8px; border-bottom: 1px solid var(--border2); text-align: left; vertical-align: middle; }
.heat th { font-size: 12px; color: var(--muted); font-weight: 600; }
.heat tr.lyr td { background: var(--surface2); font-weight: 650; font-size: 13px; color: var(--muted); }
.heat tbody tr.g { cursor: pointer; }
.heat tbody tr.g:hover td { background: var(--surface2); }

/* capability map */
.mapwrap { display: grid; grid-template-columns: minmax(0, 1fr); gap: 16px; align-items: start; }
@media (min-width: 1100px) { .mapwrap.two { grid-template-columns: minmax(0, 1fr) minmax(400px, 470px); } }
.layer { border-radius: 14px; padding: 10px 12px 12px; margin-bottom: 12px; border: 1px solid var(--border2); }
.layer.data { background: var(--l-data); } .layer.query { background: var(--l-query); } .layer.feedback { background: var(--l-feedback); } .layer.govern { background: var(--l-govern); }
.layer > h3 { display: flex; gap: 10px; align-items: baseline; flex-wrap: wrap; margin: 0 0 8px; }
.layer > h3 small { font-weight: 400; color: var(--muted); font-size: 13px; }
.ggrid { display: grid; grid-template-columns: repeat(auto-fill, minmax(255px, 1fr)); gap: 10px; }
.gcard { background: var(--surface); border: 1px solid var(--border); border-radius: 10px; padding: 9px 10px 8px; box-shadow: var(--shadow); min-width: 0; }
.gcard.sel { outline: 2px solid var(--accent); }
.ghead { width: 100%; text-align: left; background: transparent; border: 0; padding: 0; display: block; }
.ghead .gn { font-weight: 650; font-size: 14.5px; display: flex; gap: 6px; align-items: baseline; }
.ghead .gn em { font-style: normal; font-size: 12px; color: var(--muted); font-weight: 600; }
.ghead .gq { font-size: 12.5px; color: var(--muted); margin: 1px 0 6px; }
.gst { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 6px; }
.gst .pill span { font-weight: 500; opacity: .9; }
.chips { display: grid; gap: 3px; }
.chip { display: flex; align-items: center; justify-content: space-between; gap: 6px; text-align: left; border: 1px solid var(--border2); background: var(--surface2); border-radius: 7px; padding: 3px 8px; font-size: 13px; min-width: 0; }
.chip span.nm { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
.chip span.nm em { font-style: normal; color: var(--muted); font-size: 11.5px; margin-right: 4px; }
.chip:hover { border-color: var(--accent); }
.chip.sel { border-color: var(--accent); background: var(--accent-soft); }
.chip.dim { opacity: .28; }
.gcard.hide, .layer.hide { display: none; }
.drawer { background: var(--surface); border: 1px solid var(--border); border-radius: 12px; box-shadow: var(--shadow); overflow: hidden; }
.drawer.empty { padding: 18px; color: var(--muted); font-size: 14px; }
.mapwrap:not(.two) .drawer.empty { display: none; }
.dhead { padding: 12px 16px 10px; border-bottom: 1px solid var(--border2); background: var(--surface2); display: flex; gap: 10px; align-items: flex-start; }
.dhead h3 { font-size: 16px; margin: 0; }
.dhead .gq { font-size: 13px; color: var(--muted); margin: 2px 0 6px; }
.dhead .x { margin-left: auto; border: 1px solid var(--border); background: var(--surface); border-radius: 8px; width: 28px; height: 28px; line-height: 1; font-size: 16px; flex: none; }
.dbody { padding: 12px 16px 16px; max-height: none; }
@media (min-width: 1100px) { .dbody { max-height: 72vh; max-height: 640px; overflow: auto; } }
.sumrow { display: grid; gap: 8px; margin-bottom: 12px; }
.sumbox { border-left: 3px solid var(--border); padding: 4px 10px; font-size: 13.5px; background: var(--surface2); border-radius: 0 8px 8px 0; }
.sumbox.cz { border-left-color: var(--cz); } .sumbox.lf { border-left-color: var(--lf); }
.sumbox b { font-size: 12px; display: block; }
.sumbox.cz b { color: var(--cz-ink); } .sumbox.lf b { color: var(--lf-ink); }
.ilist { display: grid; gap: 6px; }
.irow { border: 1px solid var(--border2); border-radius: 9px; background: var(--surface); }
.irow.open { border-color: var(--accent); }
.itop { width: 100%; display: flex; gap: 8px; align-items: center; background: transparent; border: 0; text-align: left; padding: 6px 10px; flex-wrap: wrap; }
.itop .nm { font-weight: 600; flex: 1 1 140px; min-width: 0; }
.itop .nm em { font-style: normal; color: var(--muted); font-size: 12px; margin-right: 4px; }
.itop .car { color: var(--muted); font-size: 11px; width: 10px; }
.ibody { padding: 0 10px 10px; }
.sub { margin: 14px 0 6px; font-size: 13px; font-weight: 700; color: var(--muted); letter-spacing: .02em; }

/* evidence */
.ev { display: grid; gap: 8px; }
.evsys { border: 1px solid var(--border2); border-left: 3px solid var(--border); border-radius: 0 8px 8px 0; padding: 7px 10px; background: var(--surface2); min-width: 0; }
.evsys.cz { border-left-color: var(--cz); } .evsys.lf { border-left-color: var(--lf); }
.evsys .h { display: flex; gap: 6px; align-items: center; margin-bottom: 3px; }
.evsys p { margin: 0 0 4px; font-size: 14px; }
.evsys.na p { color: var(--muted); }
.lim { display: flex; gap: 6px; align-items: flex-start; font-size: 12.8px; background: var(--warn-soft); color: var(--warn-ink); border-radius: 6px; padding: 2px 8px; margin: 3px 0; }
.lim::before { content: "⚠ 限定"; font-weight: 700; flex: none; font-size: 11.5px; padding-top: 1px; }
.srcs { display: flex; flex-wrap: wrap; gap: 4px; margin-top: 5px; }
a.src { font: 11.5px ui-monospace, SFMono-Regular, Menlo, monospace; text-decoration: none; background: var(--accent-soft); color: var(--accent); border-radius: 5px; padding: 0 6px; line-height: 18px; white-space: nowrap; max-width: 100%; overflow: hidden; text-overflow: ellipsis; }
a.src:hover { text-decoration: underline; }
.diff { font-size: 13.5px; background: var(--accent-soft); border-radius: 8px; padding: 5px 10px; }
.diff b { color: var(--accent); }
.fix { border: 1px solid var(--border2); border-radius: 9px; padding: 8px 10px; background: var(--surface2); margin-bottom: 8px; font-size: 13.5px; }
.fix .old { color: var(--muted); text-decoration: line-through; text-decoration-color: var(--n); margin: 2px 0; }
.fix .now { margin: 2px 0; }
.infer { border-left: 3px solid var(--inf); background: var(--inf-soft); border-radius: 0 8px 8px 0; padding: 5px 10px; margin-bottom: 6px; font-size: 13.5px; }

/* compare */
.cmp { display: grid; gap: 0; border: 1px solid var(--border); border-radius: 12px; overflow: hidden; background: var(--surface); box-shadow: var(--shadow); }
.chead, .crow, .cgroup { display: grid; grid-template-columns: minmax(130px, .6fr) minmax(0, 1fr) minmax(0, 1fr); gap: 0; }
.chead { background: var(--surface2); font-size: 13px; font-weight: 700; border-bottom: 1px solid var(--border); position: sticky; top: 0; z-index: 2; }
.chead > div { padding: 8px 12px; }
.chead .c1 { color: var(--cz-ink); } .chead .c2 { color: var(--lf-ink); }
.cgroup { background: var(--surface2); border-top: 1px solid var(--border); cursor: pointer; }
.cgroup > div { padding: 8px 12px; font-size: 13px; }
.cgroup .gname { font-weight: 700; font-size: 14px; }
.cgroup .gname em { font-style: normal; color: var(--muted); font-size: 12px; font-weight: 600; display: block; }
.cgroup .sm { color: var(--muted); }
.cgroup .sm .pill { margin-bottom: 3px; }
.cgroup.dimg { opacity: .55; }
.citem { border-top: 1px solid var(--border2); }
.crow { width: 100%; text-align: left; background: transparent; border: 0; padding: 0; align-items: stretch; }
.crow:hover { background: var(--surface2); }
.crow > div { padding: 8px 12px; font-size: 13.5px; min-width: 0; }
.crow .nm { font-weight: 600; }
.crow .nm em { font-style: normal; color: var(--muted); font-size: 12px; margin-right: 4px; }
.crow .nm .lead { display: block; font-weight: 500; font-size: 12px; color: var(--muted); margin-top: 2px; }
.crow .nm .lead.cz { color: var(--cz-ink); } .crow .nm .lead.lf { color: var(--lf-ink); }
.crow .snip { display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; margin-top: 3px; color: var(--text); }
.crow .lab { display: none; font-size: 12px; font-weight: 700; margin-bottom: 2px; }
.cxp { padding: 4px 12px 12px; display: none; background: var(--surface); }
.citem.open .cxp { display: block; }
.citem.open .crow { background: var(--surface2); }
.cxp .ev { grid-template-columns: repeat(2, minmax(0, 1fr)); }
.cxp .ev .diff { grid-column: 1 / -1; }
.cmp .empty { padding: 30px; text-align: center; color: var(--muted); }

/* paths */
.pbar { display: flex; flex-wrap: wrap; gap: 8px 14px; align-items: center; margin-bottom: 12px; }
.pbar .pdesc { flex: 1 1 260px; font-size: 13.5px; color: var(--muted); }
.stepper { display: inline-flex; gap: 6px; align-items: center; }
.stepper button { border: 1px solid var(--border); background: var(--surface); border-radius: 14px; padding: 2px 12px; font-size: 13px; }
.stepper button:disabled { opacity: .4; cursor: default; }
.stepper .pos { font-size: 13px; color: var(--muted); min-width: 64px; text-align: center; }
.pwrap { display: grid; gap: 14px; grid-template-columns: minmax(0, 1fr); align-items: start; }
@media (min-width: 1100px) { .pwrap { grid-template-columns: minmax(0, 1fr) 400px; } }
.pdetail { position: relative; order: -1; }
@media (min-width: 1100px) { .pdetail { order: 0; } }
.pdetail .dhead { border-radius: 0; }
.pdetail .bd { padding: 12px 16px 14px; }
.pdetail .ph { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; margin-bottom: 4px; }
.pdetail .nbadge, .tl .nbadge, .node .nbadge { display: inline-flex; width: 22px; height: 22px; border-radius: 50%; background: var(--accent); color: #fff; font-size: 12px; font-weight: 700; align-items: center; justify-content: center; flex: none; }
html[data-theme="dark"] .pdetail .nbadge, html[data-theme="dark"] .tl .nbadge, html[data-theme="dark"] .node .nbadge { color: #04201c; }
.via { font-size: 13px; color: var(--muted); margin: 6px 0; }
.via b { color: var(--text); }
.lanes { position: relative; border: 1px solid var(--border); border-radius: 12px; background: var(--surface); box-shadow: var(--shadow); overflow: hidden; }
.lhead, .lrow { display: grid; grid-template-columns: repeat(var(--n), minmax(0, 1fr)); }
.lhead > div { padding: 7px 8px; font-size: 12.5px; font-weight: 700; text-align: center; background: var(--surface2); border-bottom: 1px solid var(--border); border-left: 1px solid var(--border2); color: var(--muted); }
.lhead > div:first-child { border-left: 0; }
.phase { grid-column: 1 / -1; font-size: 12px; font-weight: 700; color: var(--accent); background: var(--accent-soft); padding: 3px 12px; letter-spacing: .04em; border-top: 1px solid var(--border2); border-bottom: 1px solid var(--border2); position: relative; z-index: 1; }
.lrow > div { border-left: 1px solid var(--border2); padding: 7px 6px; min-height: 58px; display: flex; align-items: center; justify-content: center; }
.lrow > div:first-child { border-left: 0; }
.node { overflow-wrap: anywhere; position: relative; z-index: 1; width: 100%; text-align: left; border: 1px solid var(--border); background: var(--surface); border-radius: 9px; padding: 5px 7px; font-size: 12.5px; line-height: 1.35; display: flex; gap: 6px; align-items: flex-start; box-shadow: var(--shadow); }
.node:hover { border-color: var(--accent); }
.node.on { border-color: var(--accent); background: var(--accent-soft); outline: 2px solid var(--accent); }
.node.done .nbadge { background: var(--muted); }

}

/* ---------- paths ---------- */
var LANE_ORDER = ['ingest', 'queue', 'eval', 'store', 'query', 'ui'];
function pathById(id) { return D.paths.filter(function (p) { return p.id === id; })[0]; }
function parentOf(p, k, rs) {
  var s = p.steps[k];
  if (s.from !== undefined) return s.from;
  var j;
  if (k === rs) { for (j = k - 1; j >= 0; j--) if (p.steps[j].lane === 'store') return j; }
  for (j = k - 1; j >= 0; j--) if (!p.steps[j].par) return j;
  return 0;
}
function readStart(p) { for (var k = 0; k < p.steps.length; k++) if (p.steps[k].lane === 'ui') return k; return p.steps.length; }
function stepDetail(p, k) {
  var s = p.steps[k];
  return '<div class="ph"><span class="nbadge">' + (k + 1) + '</span><b>' + esc(s.t) + '</b></div><div class="ph"><span class="tag lyr">' + esc(D.lanes[s.lane]) + '</span><span class="tag lyr">' + (k < readStart(p) ? '写入路径' : '读取路径') + '</span></div><p style="margin:6px 0">' + rich(s.d) + '</p><div class="via"><b>经过：</b>' + rich(s.via) + '</div>' +
    s.lim.map(function (l) { return '<div class="lim"><span>' + rich(l) + '</span></div>'; }).join('') + srcs(p.sys, s.src);
}
function renderPath() {
  var el = $('#tab-path');
  var p = pathById(S.path);
  var h = '<div class="pbar"><span class="seg">' + D.paths.map(function (x) { return '<button type="button" data-p="' + x.id + '" aria-pressed="' + (S.pmode === 'one' && S.path === x.id) + '">' + esc(x.name) + '</button>'; }).join('') + '<button type="button" data-p="side" aria-pressed="' + (S.pmode === 'side') + '">三条并排</button></span>';
  if (S.pmode === 'one') {
    h += '<span class="stepper"><button type="button" data-prev ' + (S.step === 0 ? 'disabled' : '') + '>‹ 上一步</button><span class="pos">' + (S.step + 1) + ' / ' + p.steps.length + '</span><button type="button" data-next ' + (S.step === p.steps.length - 1 ? 'disabled' : '') + '>下一步 ›</button></span><span class="pdesc">' + rich(p.d) + '</span>';
  } else h += '<span class="pdesc">点任一步骤，跳到该路径的逐步视图。</span>';
  h += '</div>';
  if (S.pmode === 'side') {
    h += '<div class="side">' + D.paths.map(function (x) {
      var rs = readStart(x);
      return '<div class="col"><h3>' + esc(x.name) + '</h3><div class="cnt">' + x.steps.length + ' 步　' + rich(x.d) + '</div>' + x.steps.map(function (s, k) {
        return (k === 0 ? '<div class="mphase">写入路径</div>' : '') + (k === rs ? '<div class="mphase">读取路径</div>' : '') + '<button type="button" class="mini" data-p="' + x.id + '" data-k="' + k + '"><span class="nbadge">' + (k + 1) + '</span><span><span class="lane">' + esc(D.lanes[s.lane]) + '</span>' + esc(s.t) + '</span></button>';
      }).join('') + '</div>';
    }).join('') + '</div>';
    el.innerHTML = h; bindPath(el); return;
  }
  var lanes = LANE_ORDER.filter(function (l) { return p.steps.some(function (s) { return s.lane === l; }); });
  var rs = readStart(p);
  h += '<div class="pwrap"><div><div class="lanes" id="lanes" style="--n:' + lanes.length + '"><div class="lhead">' + lanes.map(function (l) { return '<div>' + esc(D.lanes[l]) + '</div>'; }).join('') + '</div>';
  p.steps.forEach(function (s, k) {
    if (k === 0) h += '<div class="phase">写入路径：数据怎么进来</div>';
    if (k === rs) h += '<div class="phase">读取路径：数据怎么显示</div>';
    h += '<div class="lrow">' + lanes.map(function (l) {
      return '<div>' + (l === s.lane ? '<button type="button" class="node' + (k === S.step ? ' on' : '') + (k < S.step ? ' done' : '') + '" data-k="' + k + '"><span class="nbadge">' + (k + 1) + '</span><span>' + esc(s.t) + '</span></button>' : '') + '</div>';
    }).join('') + '</div>';
  });
  h += '<svg class="lanesvg" id="lsvg" aria-hidden="true"></svg></div>';
  h += '<div class="tl"><ol>' + p.steps.map(function (s, k) {
    return (k === 0 ? '<li style="padding:0"><div class="phase">写入路径</div></li>' : '') + (k === rs ? '<li style="padding:0"><div class="phase">读取路径</div></li>' : '') + '<li class="' + (k === S.step ? 'on' : '') + '" data-k="' + k + '"><span class="nbadge">' + (k + 1) + '</span><button type="button" class="tbtn" data-k="' + k + '"><span class="lane">' + esc(D.lanes[s.lane]) + '</span>' + esc(s.t) + '</button><div class="inl"><div class="bd">' + (k === S.step ? stepDetail(p, k) : '') + '</div></div></li>';
  }).join('') + '</ol></div></div>';
  h += '<div class="drawer pdetail"><div class="dhead"><div><h3>' + esc(p.name) + '</h3><div class="gq">步骤详情</div></div></div><div class="bd">' + stepDetail(p, S.step) + '</div></div></div>';
  el.innerHTML = h; bindPath(el); redrawLanes();
}
function bindPath(el) {
  $$('[data-p]', el).forEach(function (b) {
    b.addEventListener('click', function () {
      var id = b.getAttribute('data-p'), k = b.getAttribute('data-k');
      if (id === 'side') { S.pmode = 'side'; } else { S.pmode = 'one'; S.path = id; S.step = k !== null ? +k : 0; }
      syncHash(); renderPath();
    });
  });
  $$('.node, .tbtn', el).forEach(function (b) { b.addEventListener('click', function () {
    S.step = +b.getAttribute('data-k'); syncHash(); renderPath();
    var wide = window.matchMedia('(min-width: 1100px)').matches, narrow = window.matchMedia('(max-width: 720px)').matches;
    if (!wide && !narrow) { var d = $('.pdetail'); if (d && d.scrollIntoView) d.scrollIntoView({ block: 'nearest', behavior: 'smooth' }); }
  }); });
  var pv = $('[data-prev]', el), nx = $('[data-next]', el);
  if (pv) pv.addEventListener('click', function () { if (S.step > 0) { S.step--; syncHash(); renderPath(); } });
  if (nx) nx.addEventListener('click', function () { if (S.step < pathById(S.path).steps.length - 1) { S.step++; syncHash(); renderPath(); } });
}
function alignDetail() {
  var det = $('.pdetail'), box = $('#lanes'), node = $('.node.on');
  if (!det) return;
  det.style.marginTop = '';
  if (!box || box.offsetParent === null || !node || !window.matchMedia('(min-width: 1100px)').matches) return;
  var off = node.getBoundingClientRect().top - box.getBoundingClientRect().top;
  det.style.marginTop = Math.max(0, Math.min(off, box.offsetHeight - det.offsetHeight)) + 'px';
}
function redrawLanes() {
  alignDetail();
  var svg = $('#lsvg'), box = $('#lanes');
  if (!svg || !box || box.offsetParent === null) return;
  var rect = box.getBoundingClientRect(), nodes = $$('.node', box), css = getComputedStyle(document.documentElement);
  var out = '<defs><marker id="arr" viewBox="0 0 8 8" refX="7" refY="4" markerUnits="userSpaceOnUse" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0 L8 4 L0 8 z"/></marker></defs>';
  var p = pathById(S.path), rs = readStart(p);
  for (var k = 1; k < nodes.length; k++) {
    var par = parentOf(p, k, rs);
    var a = nodes[par].getBoundingClientRect(), b = nodes[k].getBoundingClientRect();
    var x1 = a.left + a.width / 2 - rect.left, y1 = a.bottom - rect.top, x2 = b.left + b.width / 2 - rect.left, y2 = b.top - rect.top, my = (y1 + y2) / 2;
    var act = (k === S.step);
    out += '<path class="' + (act ? 'act ' : '') + (k === rs ? 'dash' : '') + '" marker-end="url(#arr)" d="M' + x1 + ' ' + y1 + ' C' + x1 + ' ' + my + ' ' + x2 + ' ' + my + ' ' + x2 + ' ' + (y2 - 1) + '"/>';
  }
  svg.setAttribute('viewBox', '0 0 ' + rect.width + ' ' + rect.height);
  svg.innerHTML = out;
}

/* ---------- notes ---------- */
function renderNotes() {
  var fixes = [], infers = [];
  G.forEach(function (g) { g.fix.forEach(function (f) { fixes.push({ g: g, f: f }); }); g.infer.forEach(function (x) { infers.push({ g: g, x: x }); }); });
  var h = '<h2>对旧笔记的修正（' + fixes.length + ' 条）</h2><div class="note" style="margin-bottom:8px">旧笔记指本次调研之前的 Trace 设计笔记。两者冲突时，以新调研为准。</div>';
  h += fixes.map(function (e) {
    return '<div class="card ncard">' + fixHTML(e.f) + '<div class="ref">来自能力组 <button type="button" data-g="' + e.g.id + '">' + e.g.id + '. ' + esc(e.g.short) + '</button></div></div>';
  }).join('');
  h += '<h2>推断（' + infers.length + ' 条）</h2><div class="note" style="margin-bottom:8px">推断不是源码直接写明的事实。每条都给出依据。</div>';
  h += '<div class="two-col">' + ['cz', 'lf'].map(function (s) {
    return '<div><h3>' + tag(s) + '</h3>' + infers.filter(function (e) { return e.x.sys === s; }).map(function (e) {
      return '<div class="infer"><span class="tag inf">【推断】</span> ' + rich(e.x.t) + '<div class="ref" style="font-size:12.5px;margin-top:3px"><span class="note">能力组</span> <button type="button" data-g="' + e.g.id + '" style="border:0;background:transparent;color:var(--accent);text-decoration:underline;padding:0">' + e.g.id + '. ' + esc(e.g.short) + '</button></div></div>';
    }).join('') + '</div>';
  }).join('') + '</div>';
  h += '<h2>范围与限制</h2><div class="card"><ul class="limits">' + D.limits.map(function (t) { return '<li>' + rich(t) + '</li>'; }).join('') + '</ul></div>';
  var el = $('#tab-notes'); el.innerHTML = h;
  $$('button[data-g]', el).forEach(function (b) { b.addEventListener('click', function () { openGroup(+b.getAttribute('data-g')); }); });
}

/* ---------- tabs and hash ---------- */
var RENDER = { overview: renderOverview, map: renderMap, cmp: renderCmp, path: renderPath, notes: renderNotes };
var rendered = {};
function setTab(t) {
  S.tab = t;
  $$('#nav button').forEach(function (b) { b.setAttribute('aria-selected', b.getAttribute('data-tab') === t); });
  $$('section.tab').forEach(function (s) { s.classList.toggle('on', s.id === 'tab-' + t); });
  RENDER[t](); rendered[t] = true;
  syncHash();
}
function syncHash() {
  var h = '#' + S.tab;
  if (S.tab === 'map' && S.selG) h += '/' + (S.selI || S.selG);
  if (S.tab === 'path') h += '/' + (S.pmode === 'side' ? 'side' : S.path + '/' + (S.step + 1));
  if (history.replaceState) { try { history.replaceState(null, '', location.pathname + location.search + h); } catch (e) { /* ignore */ } }
}
function readHash() {
  var m = location.hash.replace(/^#/, '').split('/');
  if (!RENDER[m[0]]) return;
  S.tab = m[0];
  if (m[0] === 'map' && m[1]) {
    if (ITEMS[m[1]]) { S.selG = ITEMS[m[1]].g.id; S.selI = m[1]; S.openMap[m[1]] = true; } else if (+m[1]) S.selG = +m[1];
  }
  if (m[0] === 'path' && m[1]) {
    if (m[1] === 'side') S.pmode = 'side';
    else if (pathById(m[1])) { S.path = m[1]; S.step = Math.max(0, Math.min(pathById(m[1]).steps.length - 1, (+m[2] || 1) - 1)); }
  }
}

function init() {
  initTheme();
  $('#meta').innerHTML = ['cz', 'lf'].map(function (s) { return '<span>' + SYSNAME[s] + ' @ <a target="_blank" rel="noopener" href="' + SYS[s].tree + '">' + SYS[s].sha.slice(0, 8) + '</a></span>'; }).join('') +
    '<span>' + G.length + ' 组能力 · ' + allItems().length + ' 项 · ' + nsrc() + ' 条源码链接</span>' +
    '<span>文档版：<a href="../../research/ai-infra/observability-feature-design/">总览</a> / <a href="../../research/ai-infra/observability-feature-design/comparison/">对照表</a></span>';
  $$('#nav button').forEach(function (b) { b.addEventListener('click', function () { setTab(b.getAttribute('data-tab')); }); });
  readHash();
  setTab(S.tab);
  var rt; window.addEventListener('resize', function () { clearTimeout(rt); rt = setTimeout(function () { if (S.tab === 'map') fillDrawer(); if (S.tab === 'path') redrawLanes(); }, 80); });
  window.addEventListener('hashchange', function () { readHash(); setTab(S.tab); });
  document.addEventListener('keydown', function (e) {
    if (S.tab !== 'path' || S.pmode !== 'one' || /input|textarea/i.test((e.target || {}).tagName || '')) return;
    var n = pathById(S.path).steps.length;
    if (e.key === 'ArrowRight' && S.step < n - 1) { S.step++; syncHash(); renderPath(); } else if (e.key === 'ArrowLeft' && S.step > 0) { S.step--; syncHash(); renderPath(); }
  });
}
D.lanes = D.lanes || {};
init();
})();
</script>
